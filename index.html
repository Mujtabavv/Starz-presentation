<style>

    /* =========================================================
       STARZ — MOBILE-FIRST PRESENTATION SYSTEM
       ========================================================= */

    :root {
        --black: #0D0D0D;
        --black-2: #111111;
        --black-3: #171717;

        --red: #E63920;
        --red-dark: #B92D1B;
        --red-soft: rgba(230,57,32,0.12);

        --white: #FFFFFF;
        --gray: #A0A0A0;
        --gray-2: #666666;
        --border: #292929;

        --green: #6DBF73;

        --radius: 16px;
        --radius-small: 10px;

        --shadow:
            0 15px 40px rgba(0,0,0,0.35);
    }


    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        background: var(--black) !important;
    }

    body {
        font-family: 'Cairo', sans-serif !important;
        overflow: hidden;
    }

    .reveal {
        font-family: 'Cairo', sans-serif !important;
        background: var(--black);
    }

    .reveal .slides {
        text-align: right;
    }

    .reveal .slides section {
        height: 100%;
        padding: 65px 70px 60px;
        overflow: hidden;
    }

    .reveal,
    .reveal p,
    .reveal li,
    .reveal span,
    .reveal div,
    .reveal td,
    .reveal th {
        font-family: 'Cairo', sans-serif;
        color: var(--white);
    }

    .reveal p,
    .reveal li {
        font-size: 0.72em;
        line-height: 1.75;
    }

    .reveal strong {
        font-weight: 800;
    }

    .reveal ul {
        margin-right: 0;
        padding-right: 1.2em;
    }

    .reveal li {
        margin-bottom: 13px;
    }

    .reveal li::marker {
        color: var(--red);
    }


    /* =========================================================
       HEADINGS
       ========================================================= */

    .reveal h1,
    .reveal h2,
    .reveal h3 {
        font-family: 'Cairo', sans-serif;
        text-transform: none;
        font-weight: 900;
    }

    .reveal h1 {
        font-size: 2.35em;
        line-height: 1.2;
        margin: 0 0 25px;
        color: var(--white);
    }

    .reveal h2 {
        display: block;
        border: none;
        padding: 0;
        margin: 0 0 30px;
        color: var(--white) !important;
        font-size: 1.55em;
        line-height: 1.25;
    }

    .reveal h2::after {
        content: "";
        display: block;
        width: 65px;
        height: 4px;
        background: var(--red);
        margin-top: 12px;
        border-radius: 10px;
    }

    .reveal h3 {
        font-size: 1em;
        margin: 0 0 12px;
    }


    /* =========================================================
       COLORS
       ========================================================= */

    .red {
        color: var(--red) !important;
    }

    .muted {
        color: var(--gray) !important;
    }

    .green {
        color: var(--green) !important;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .starz-header {
        position: absolute;

        top: 18px;
        left: 55px;
        right: 55px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        height: 38px;

        z-index: 10;
    }

    .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .header-brand img {
        width: 48px;
        height: 28px;

        object-fit: contain;
        object-position: center;
    }

    .header-brand span {
        font-size: 0.34em;
        color: var(--gray);
        font-weight: 700;
        letter-spacing: 1px;
    }

    .header-section {
        font-size: 0.30em;
        color: var(--gray-2);
        font-weight: 700;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .starz-footer {
        position: absolute;

        bottom: 15px;
        left: 55px;
        right: 55px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        font-size: 0.25em;
        color: var(--gray-2);

        z-index: 10;
    }

    .footer-line {
        flex: 1;
        height: 1px;
        background: var(--border);
        margin: 0 18px;
    }

    .page-number {
        color: var(--red);
        font-weight: 900;
    }


    /* =========================================================
       SECTION LABEL
       ========================================================= */

    .section-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;

        font-size: 0.32em;
        color: var(--red);

        font-weight: 900;
        letter-spacing: 1px;

        margin-bottom: 14px;
    }

    .section-label::before {
        content: "";

        width: 28px;
        height: 3px;

        background: var(--red);
    }


    /* =========================================================
       COVER
       ========================================================= */

    .cover-slide {
        display: flex !important;

        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center !important;

        background:
            radial-gradient(
                circle at 50% 20%,
                rgba(230,57,32,0.12),
                transparent 35%
            );
    }

    .cover-header {
        position: absolute;

        top: 25px;
        left: 55px;
        right: 55px;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .cover-header img {
        width: 95px;
        height: 48px;

        object-fit: contain;
        object-position: center;
    }

    .cover-kicker {
        font-size: 0.35em;
        color: var(--red);
        font-weight: 900;
        letter-spacing: 2px;
    }

    .cover-image {
        width: min(620px, 85vw);
        height: 300px;

        /*
         * IMPORTANT:
         * Never crop the original image.
         */
        object-fit: contain;
        object-position: center;

        border-radius: 18px;
        border: 1px solid var(--border);

        background: var(--black-2);

        box-shadow: var(--shadow);

        margin: 20px 0 25px;
    }

    .cover-title {
        max-width: 850px;
    }

    .cover-title .accent {
        color: var(--red);
    }

    .cover-meta {
        color: var(--gray) !important;
        font-size: 0.38em !important;
        line-height: 1.8 !important;
        margin-top: 10px;
    }


    /* =========================================================
       LOCATION NOTE
       ========================================================= */

    .location-note {
        width: min(850px, 90%);
        margin: 15px auto 0;

        padding: 12px 18px;

        background: var(--red-soft);

        border: 1px solid rgba(230,57,32,0.35);

        border-right: 4px solid var(--red);

        border-radius: 10px;

        color: var(--white);

        font-size: 0.36em;

        line-height: 1.7;

        text-align: center;
    }

    .location-note strong {
        color: var(--red);
    }


    /* =========================================================
       INDEX
       ========================================================= */

    .index-grid {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

        margin-top: 25px;
    }

    .index-item {
        display: flex;
        align-items: center;
        gap: 18px;

        padding: 15px 18px;

        background: var(--black-2);

        border: 1px solid var(--border);

        border-radius: var(--radius-small);
    }

    .index-number {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;

        background: var(--red);

        color: white !important;

        font-size: 0.48em;
        font-weight: 900;

        flex-shrink: 0;
    }

    .index-name {
        font-size: 0.48em;
        font-weight: 700;
    }

    .index-desc {
        display: block;

        color: var(--gray) !important;

        font-size: 0.34em;

        margin-top: 3px;
    }


    /* =========================================================
       IMAGE CARDS
       ========================================================= */

    .image-card {
        position: relative;

        overflow: hidden;

        border-radius: var(--radius);

        background: var(--black-2);

        border: 1px solid var(--border);

        box-shadow: var(--shadow);

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .image-card img {
        width: 100%;
        height: 100%;

        display: block;

        /*
         * FULL IMAGE — NO CROPPING
         */
        object-fit: contain;
        object-position: center;

        margin: 0;

        background: var(--black-2);
    }

    .image-card::after {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                to top,
                rgba(0,0,0,0.55),
                transparent 45%
            );

        pointer-events: none;
    }

    .image-caption {
        position: absolute;

        bottom: 18px;
        right: 20px;
        left: 20px;

        z-index: 2;

        font-size: 0.34em;

        font-weight: 700;

        text-shadow:
            0 2px 8px rgba(0,0,0,0.8);
    }


    /* =========================================================
       TWO COLUMN
       ========================================================= */

    .two-column {
        display: grid;

        grid-template-columns:
            minmax(0, 1.15fr)
            minmax(280px, 0.85fr);

        gap: 35px;

        align-items: center;

        height: calc(100% - 80px);
    }

    .two-column.reverse {
        grid-template-columns:
            minmax(280px, 0.85fr)
            minmax(0, 1.15fr);
    }

    .content-column {
        min-width: 0;
    }

    .visual-column {
        height: 62vh;

        min-height: 0;
    }

    .visual-column .image-card {
        width: 100%;
        height: 100%;
    }


    /* =========================================================
       STATS
       ========================================================= */

    .stats-grid {
        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 15px;

        margin: 25px 0;
    }

    .stat-card {
        background: var(--black-2);

        border: 1px solid var(--border);

        border-radius: var(--radius-small);

        padding: 22px;

        text-align: center;
    }

    .stat-value {
        display: block;

        color: var(--red) !important;

        font-size: 0.9em;

        font-weight: 900;

        line-height: 1.2;

        margin-bottom: 8px;
    }

    .stat-label {
        font-size: 0.34em;

        color: var(--gray) !important;
    }


    /* =========================================================
       FEATURE BOX
       ========================================================= */

    .feature-box {
        background:
            linear-gradient(
                135deg,
                var(--black-2),
                var(--black-3)
            );

        border: 1px solid var(--border);

        border-right: 4px solid var(--red);

        border-radius: var(--radius-small);

        padding: 18px 22px;

        margin: 18px 0;
    }

    .feature-box p {
        margin: 0;
    }


    /* =========================================================
       TABLES
       ========================================================= */

    .table-wrapper {
        width: 100%;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;

        border-radius: var(--radius-small);

        border: 1px solid var(--border);

        box-shadow: var(--shadow);
    }

    .reveal table {
        width: 100%;
        min-width: 720px;

        margin: 0;

        border-collapse: collapse;

        font-size: 0.47em;

        background: var(--black-2);

        border: none;
    }

    .reveal th,
    .reveal td {
        padding: 13px 15px;

        border: 1px solid var(--border);

        text-align: center;
    }

    .reveal th {
        background: var(--red) !important;

        color: var(--white) !important;

        font-weight: 900;
    }

    .reveal td {
        color: var(--white);
    }

    .reveal tr:nth-child(even) td {
        background: #141414;
    }

    .reveal tr:last-child td {
        background: #191919;

        font-weight: 800;
    }


    /* =========================================================
       MENU
       ========================================================= */

    .menu-section {
        background: var(--black-2);

        border: 1px solid var(--border);

        border-radius: var(--radius-small);

        padding: 17px 20px;

        margin-bottom: 13px;
    }

    .menu-title {
        color: var(--red) !important;

        font-size: 0.45em;

        font-weight: 900;

        margin-bottom: 8px;
    }

    .menu-item {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        padding: 5px 0;

        border-bottom: 1px solid #222;

        font-size: 0.38em;
    }

    .menu-item:last-child {
        border-bottom: none;
    }

    .price {
        color: var(--red) !important;

        font-weight: 900;

        white-space: nowrap;

        margin-right: 20px;
    }


    /* =========================================================
       BREAK EVEN
       ========================================================= */

    .break-even {
        display: flex;

        align-items: center;
        justify-content: center;

        flex-direction: column;

        padding: 25px;

        margin-top: 25px;

        background:
            radial-gradient(
                circle,
                rgba(230,57,32,0.15),
                transparent 65%
            );

        border: 1px solid var(--red);

        border-radius: var(--radius);
    }

    .break-even-label {
        color: var(--gray) !important;

        font-size: 0.38em;
    }

    .break-even-value {
        color: var(--red) !important;

        font-size: 1.55em;

        font-weight: 900;

        line-height: 1.2;

        margin: 8px 0;
    }

    .break-even-sub {
        color: var(--white) !important;

        font-size: 0.42em;
    }


    /* =========================================================
       PROFIT
       ========================================================= */

    .profit-highlight {
        display: inline-block;

        color: var(--red) !important;

        font-size: 0.75em;

        font-weight: 900;

        padding: 3px 10px;

        border-radius: 7px;

        background: var(--red-soft);
    }


    /* =========================================================
       END
       ========================================================= */

    .end-slide {
        display: flex !important;

        flex-direction: column;

        justify-content: center;
        align-items: center;

        text-align: center !important;

        background:
            radial-gradient(
                circle at center,
                rgba(230,57,32,0.12),
                transparent 45%
            );
    }

    .end-slide img {
        width: 160px;

        max-height: 90px;

        object-fit: contain;

        margin-bottom: 35px;
    }

    .end-title {
        color: var(--white) !important;

        font-size: 1.5em;

        font-weight: 900;
    }

    .end-title span {
        color: var(--red) !important;
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 900px) {

        .reveal .slides section {
            padding: 55px 35px 50px;
        }

        .two-column,
        .two-column.reverse {
            grid-template-columns: 1fr;

            gap: 20px;

            height: auto;
        }

        .visual-column {
            height: 34vh;

            min-height: 220px;
        }

        .stats-grid {
            grid-template-columns:
                repeat(3, 1fr);
        }

        .index-grid {
            grid-template-columns: 1fr;
        }

        .cover-image {
            width: 90%;
            height: 240px;
        }

        .starz-header {
            left: 30px;
            right: 30px;
        }

        .starz-footer {
            left: 30px;
            right: 30px;
        }
    }


    /* =========================================================
       MOBILE PHONE
       ========================================================= */

    @media (max-width: 600px) {

        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        .reveal {
            width: 100vw;
            height: 100vh;
        }

        /*
         * Slides are now portrait-oriented.
         */
        .reveal .slides {
            width: 100%;
            height: 100%;
        }

        .reveal .slides section {
            width: 100% !important;
            height: 100% !important;

            padding:
                58px
                18px
                48px;

            overflow-y: auto;
            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;
        }


        /* ---------------------------------------------------------
           Typography
           --------------------------------------------------------- */

        .reveal h1 {
            font-size: 1.65em;

            line-height: 1.3;

            margin-bottom: 16px;
        }

        .reveal h2 {
            font-size: 1.15em;

            line-height: 1.35;

            margin-bottom: 20px;
        }

        .reveal h2::after {
            width: 45px;
            height: 3px;

            margin-top: 8px;
        }

        .reveal h3 {
            font-size: 0.82em;
        }

        .reveal p,
        .reveal li {
            font-size: 0.70em;

            line-height: 1.75;
        }

        .reveal li {
            margin-bottom: 10px;
        }


        /* ---------------------------------------------------------
           Header
           --------------------------------------------------------- */

        .starz-header {
            position: absolute;

            top: 12px;
            left: 16px;
            right: 16px;

            height: 30px;
        }

        .header-brand {
            gap: 6px;
        }

        .header-brand img {
            width: 42px;
            height: 24px;
        }

        .header-brand span {
            display: none;
        }

        .header-section {
            font-size: 0.26em;
        }


        /* ---------------------------------------------------------
           Footer
           --------------------------------------------------------- */

        .starz-footer {
            position: absolute;

            bottom: 10px;

            left: 16px;
            right: 16px;

            font-size: 0.22em;
        }

        .footer-line {
            margin: 0 10px;
        }


        /* ---------------------------------------------------------
           Section label
           --------------------------------------------------------- */

        .section-label {
            font-size: 0.25em;

            gap: 7px;

            margin-bottom: 9px;
        }

        .section-label::before {
            width: 20px;
            height: 2px;
        }


        /* ---------------------------------------------------------
           Cover
           --------------------------------------------------------- */

        .cover-slide {
            padding:
                55px
                20px
                35px !important;

            justify-content: center;
        }

        .cover-header {
            top: 15px;

            left: 18px;
            right: 18px;
        }

        .cover-header img {
            width: 70px;
            height: 34px;
        }

        .cover-kicker {
            font-size: 0.24em;

            letter-spacing: 1px;
        }

        .cover-image {
            width: 92vw;
            max-width: 420px;

            /*
             * Mobile image gets enough vertical room,
             * while preserving the original aspect ratio.
             */
            height: 28vh;
            min-height: 170px;

            object-fit: contain;

            margin: 12px 0 18px;
        }

        .cover-title {
            max-width: 95%;
        }

        .cover-meta {
            font-size: 0.27em !important;

            line-height: 1.8 !important;

            margin-top: 8px;
        }

        .location-note {
            width: 94%;

            padding: 9px 12px;

            margin-top: 10px;

            font-size: 0.26em;

            line-height: 1.65;
        }


        /* ---------------------------------------------------------
           Index
           --------------------------------------------------------- */

        .index-grid {
            grid-template-columns: 1fr;

            gap: 8px;

            margin-top: 15px;
        }

        .index-item {
            gap: 11px;

            padding: 10px 12px;
        }

        .index-number {
            width: 34px;
            height: 34px;

            border-radius: 8px;

            font-size: 0.34em;
        }

        .index-name {
            font-size: 0.36em;
        }

        .index-desc {
            font-size: 0.26em;

            margin-top: 2px;
        }


        /* ---------------------------------------------------------
           Two column → stacked mobile layout
           --------------------------------------------------------- */

        .two-column,
        .two-column.reverse {
            display: flex;

            flex-direction: column;

            gap: 15px;

            width: 100%;

            height: auto;

            align-items: stretch;
        }

        .content-column {
            width: 100%;
        }

        .visual-column {
            width: 100%;

            height: auto;

            min-height: 0;

            max-height: none;

            order: 2;
        }

        .two-column.reverse .visual-column {
            order: 1;
        }

        .two-column.reverse .content-column {
            order: 2;
        }


        /* ---------------------------------------------------------
           Mobile images
           --------------------------------------------------------- */

        .image-card {
            width: 100%;

            /*
             * Do not force a 16:9 crop.
             */
            height: auto;

            min-height: 180px;

            max-height: 42vh;

            aspect-ratio: auto;
        }

        .image-card img {
            width: 100%;
            height: auto;

            max-height: 42vh;

            object-fit: contain;

            object-position: center;
        }

        .image-caption {
            right: 12px;
            left: 12px;
            bottom: 10px;

            font-size: 0.25em;
        }


        /* ---------------------------------------------------------
           Stats
           --------------------------------------------------------- */

        .stats-grid {
            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            margin: 15px 0;
        }

        .stat-card {
            padding: 12px 6px;
        }

        .stat-value {
            font-size: 0.48em;

            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.23em;

            line-height: 1.4;
        }


        /* ---------------------------------------------------------
           Feature boxes
           --------------------------------------------------------- */

        .feature-box {
            padding: 12px 14px;

            margin: 12px 0;

            border-right-width: 3px;
        }

        .feature-box p {
            font-size: 0.62em;
        }


        /* ---------------------------------------------------------
           Tables
           --------------------------------------------------------- */

        .table-wrapper {
            width: 100%;

            overflow-x: auto;

            margin-top: 10px;
        }

        .reveal table {
            min-width: 650px;

            font-size: 0.36em;
        }

        .reveal th,
        .reveal td {
            padding: 9px 10px;
        }


        /* ---------------------------------------------------------
           Menu
           --------------------------------------------------------- */

        .menu-section {
            padding: 12px 13px;

            margin-bottom: 8px;
        }

        .menu-title {
            font-size: 0.36em;

            margin-bottom: 5px;
        }

        .menu-item {
            font-size: 0.30em;

            padding: 4px 0;

            gap: 8px;
        }

        .price {
            margin-right: 8px;
        }


        /* ---------------------------------------------------------
           Break-even
           --------------------------------------------------------- */

        .break-even {
            padding: 18px 12px;

            margin-top: 15px;
        }

        .break-even-label {
            font-size: 0.28em;
        }

        .break-even-value {
            font-size: 1.05em;

            margin: 5px 0;
        }

        .break-even-sub {
            font-size: 0.30em;
        }

        .break-even p {
            font-size: 0.52em !important;
        }


        /* ---------------------------------------------------------
           End
           --------------------------------------------------------- */

        .end-slide img {
            width: 110px;

            max-height: 65px;

            margin-bottom: 22px;
        }

        .end-title {
            font-size: 1.05em;
        }

        .end-slide p {
            font-size: 0.30em !important;
        }
    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 380px) {

        .reveal .slides section {
            padding:
                54px
                14px
                44px;
        }

        .reveal h1 {
            font-size: 1.45em;
        }

        .reveal h2 {
